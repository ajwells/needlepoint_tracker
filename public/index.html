<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Needlepoint Tracker</title>
  <meta name="description" content="Track needlepoint threads and canvases.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b5476b'/%3E%3Cpath d='M8 8h4v4H8zM14 14h4v4h-4zM20 20h4v4h-4zM20 8h4v4h-4zM8 20h4v4H8z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8"/><path d="M8 8h4v4H8zM14 14h4v4h-4zM20 20h4v4h-4zM20 8h4v4h-4zM8 20h4v4H8z"/></svg>
        </span>
        <span class="brand-name">Needlepoint Tracker</span>
      </div>

      <nav class="tabs" role="tablist" aria-label="Sections">
        <button class="tab" role="tab" data-tab="threads">Threads <span class="tab-count" id="count-threads">0</span></button>
        <button class="tab" role="tab" data-tab="canvases">Canvases <span class="tab-count" id="count-canvases">0</span></button>
      </nav>

      <div class="topbar-actions">
        <div class="menu-wrap">
          <button class="btn ghost sm" id="btn-export" title="Export your data" aria-haspopup="true" aria-expanded="false" aria-controls="export-menu">
            <span data-icon="download"></span><span class="hide-sm">Export</span>
          </button>
          <div class="menu" id="export-menu" hidden>
            <button type="button" data-export="json">
              <strong>Backup (JSON)</strong><span>Everything, including photos. Use this with Import.</span>
            </button>
            <button type="button" data-export="threads-csv">
              <strong>Threads (CSV)</strong><span>A spreadsheet of your threads. No photos.</span>
            </button>
            <button type="button" data-export="canvases-csv">
              <strong>Canvases (CSV)</strong><span>A spreadsheet of your canvases and their thread lists. No photos.</span>
            </button>
          </div>
        </div>
        <div class="menu-wrap">
          <button class="btn ghost sm" id="btn-import" title="Import a backup file" aria-haspopup="true" aria-expanded="false" aria-controls="import-menu">
            <span data-icon="upload"></span><span class="hide-sm">Import</span>
          </button>
          <div class="menu" id="import-menu" hidden>
            <button type="button" data-import="merge">
              <strong>Add to my data</strong><span>Keeps what you have. Items already in your data are updated from the file.</span>
            </button>
            <button type="button" data-import="replace" class="danger">
              <strong>Replace all data</strong><span>Deletes all your threads and canvases, then loads the file.</span>
            </button>
          </div>
        </div>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
        <div class="user-menu" id="user-menu" hidden>
          <span class="user-name hide-sm" id="user-name"></span>
          <button class="btn ghost sm" id="btn-logout" title="Log out">
            <span data-icon="logout"></span><span class="hide-sm btn-label">Log out</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <section id="auth" class="auth" hidden>
    <form id="auth-form" class="auth-card" novalidate>
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8"/><path d="M8 8h4v4H8zM14 14h4v4h-4zM20 20h4v4h-4zM20 8h4v4h-4zM8 20h4v4H8z"/></svg>
      </span>
      <h1 id="auth-title">Log in</h1>
      <p class="muted" id="auth-lead"></p>
      <label class="field">
        <span class="label">Username</span>
        <input name="username" required autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32">
      </label>
      <label class="field">
        <span class="label">Password</span>
        <input name="password" type="password" required autocomplete="current-password">
        <small class="hint" id="auth-password-hint" hidden>At least 8 characters.</small>
      </label>
      <p class="auth-error" id="auth-error" role="alert" hidden></p>
      <button class="btn primary" id="auth-submit" type="submit">Log in</button>
      <p class="auth-switch muted" id="auth-switch"></p>
      <div class="auth-divider" aria-hidden="true"><span>or</span></div>
      <button class="btn ghost" id="auth-guest" type="button">Continue as guest</button>
      <p class="auth-guest-note">
        <strong>Guest data is not saved on the server.</strong> It stays in this browser only. Use Export and Import to back it up or share it.
      </p>
    </form>
  </section>

  <div class="guest-banner" id="guest-banner" role="status" hidden>
    <div class="guest-banner-inner">
      <span><strong>Guest mode:</strong> your data is only saved in this browser, not on the server. Use <strong>Export</strong> and <strong>Import</strong> to back it up or share it.</span>
      <button type="button" class="link" id="guest-signup">Create an account</button>
    </div>
  </div>

  <main class="container">
    <!-- THREADS -->
    <section id="view-threads" class="view" hidden>
      <div class="view-head">
        <div>
          <h1>Threads</h1>
          <p class="muted" id="threads-summary"></p>
        </div>
        <button class="btn primary" data-new="thread"><span data-icon="plus"></span>Add thread</button>
      </div>

      <div class="toolbar">
        <label class="search">
          <span data-icon="search"></span>
          <input type="search" id="thread-search" placeholder="Search brand, color, code, material…" autocomplete="off">
        </label>
        <select id="thread-sort" class="select" aria-label="Sort threads">
          <option value="brand">Sort: Brand &amp; code</option>
          <option value="color">Sort: Color family</option>
          <option value="amount">Sort: Least left</option>
          <option value="recent">Sort: Recently added</option>
        </select>
      </div>
      <div class="family-filter stock-filter" id="stock-filter" role="group" aria-label="Filter by stock"></div>
      <div class="family-filter" id="family-filter" role="group" aria-label="Filter by color family"></div>

      <div class="grid" id="thread-grid"></div>
    </section>

    <!-- CANVASES -->
    <section id="view-canvases" class="view" hidden>
      <div class="view-head">
        <div>
          <h1>Canvases</h1>
          <p class="muted" id="canvases-summary"></p>
        </div>
        <button class="btn primary" data-new="canvas"><span data-icon="plus"></span>Add canvas</button>
      </div>

      <div class="toolbar">
        <label class="search">
          <span data-icon="search"></span>
          <input type="search" id="canvas-search" placeholder="Search name, designer, shop, finish type, gifted…" autocomplete="off">
        </label>
      </div>
      <div class="family-filter" id="status-filter" role="group" aria-label="Filter by status"></div>

      <div class="grid grid-canvas" id="canvas-grid"></div>
    </section>
  </main>

  <dialog id="modal" class="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
